[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-dialog = "2.4.2"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[[bin]]
name = "desktop"
path = "src/main.rs"
